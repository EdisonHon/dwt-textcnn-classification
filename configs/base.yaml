project:
  name: dwt-textcnn-classification
  dataset: sst2

experiment:
  name: base
  seeds: [13, 21, 42, 87, 100]

data:
  source_url: https://nlp.stanford.edu/sentiment/trainDevTestTrees_PTB.zip
  archive_sha256: 5c613a4f673fc74097d523a2c83f38e0cc462984d847b82c7aaf36b01cbbbfcc
  source_path: null
  split_sha256:
    train: e2f3f41b0b1e6d4dddc0effe3bfc2d27ed8928079aa9a03d652311614fc5feb7
    dev: 0e9336aed6e4730e19f58d00a77b3f0297efdb755f7b5e598c98a05e3f97ea40
    test: 6e54806dee95cf80cd918e7dfb3f6770f6df24bf826f289a4d1f709e1c8f6761
  expected_binary_counts:
    train: 6920
    dev: 872
    test: 1821
  vocabulary_scope: train-only
  special_tokens:
    pad: <pad>
    unk: <unk>
  minimum_sequence_length: 7

embedding:
  method: original
  dimension: 300
  dtype: float32
  word2vec_path: null
  word2vec_md5: a5e5354d40acb95f9ec66d5977d140ef
  word2vec_sha256: cdd97c3b73abcd8e1437ad3837b8faf98fc21258f61f031721fe3e2096ed89d9
  oov_initialization:
    distribution: uniform
    low: -0.25
    high: 0.25
  pretrained_trainable: true
  random_trainable: true
  dwt:
    wavelet: coif1
    level: 1
    mode: periodization
    coefficient: cA
  pca:
    n_components: 150
    whiten: false
    svd_solver: full

model:
  kernel_sizes: [5, 6, 7]
  filters_per_size: 100
  dropout: 0.5
  num_classes: 2

training:
  batch_size: 50
  max_epochs: 30
  optimizer:
    name: adadelta
    learning_rate: 1.0
    rho: 0.95
    eps: 1.0e-6
  early_stopping:
    metric: accuracy
    patience: 5
  deterministic: true

evaluation:
  metrics: [accuracy, macro_f1]

paths:
  data_dir: data
  prepared_data_dir: data/processed/sst2
  prepared_embedding_dir: data/processed/embeddings
  output_dir: outputs
